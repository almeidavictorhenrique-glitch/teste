<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login Admin - InteracX</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
        url("/static/imagens/fundo.png");
    background-size: cover;
    background-position: center;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: rgba(255,255,255,0.12);
    padding: 35px;
    border-radius: 18px;
    width: 320px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

h1 {
    margin-bottom: 25px;
}

input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    width: 98%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 10px;
    border: none;
    background: #2ecc71;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #27ae60;
}

.erro {
    color: #ff7675;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="login-box">
    <h1>🔐 Admin</h1>

    <form method="POST">
        <input type="text" name="usuario" placeholder="Usuário" required>
        <input type="password" name="senha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}
</div>

</body>
</html>
