/* ===== CONTROLE DAS TELAS ===== */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.tela {
  display: none;
  width: 100vw;
  min-height: 100vh;
}

.tela.ativa {

  display:block;
  animation:fade 0.5s ease-in;
}

/* CENTRALIZA SOMENTE HOME E INICIO */
#home.ativa,
#inicio.ativa {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.inicio-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px; /* espaço entre leão e botão */
}

@keyframes balanco {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(3deg); }
  100% { transform: rotate(0deg); }
}

.mascote {
 width: 900px;
 max-width: 30vw;
 animation: balanco 2s infinite;
}

/* Ajuste específico da tela de pergunta */
#pergunta {
  justify-content: flex-start; /* Começa do topo */
  padding-top: 40px;
}

/* Espaço abaixo do input */
#pergunta input {
  margin-bottom: 20px;
}

/* ===== TÍTULOS ===== */
.tela h1 {
  font-size: min(7vw, 70px);
  font-weight: bold;
  text-shadow: 3px 3px 15px rgba(0,0,0,0.5); /* Sombra no texto */
  margin-bottom: 30px;
}

/* Título menor na tela de pergunta */
#pergunta h1 {
  font-size: 50px;
}

/* ===== LAYOUT PRINCIPAL ===== */
.layout {
  display: flex; /* Divide a tela em lateral + conteúdo */
  width: 100%;
}

/* layout mapa*/

.mapa-container {
  position: relative;
  display: inline-block;

}

#mapaBase {
  width: min(85vw,700px);
max-height: 65vh;
}

/* ===== MARCADOR MODERNO ===== */

#marcador{

    position:absolute;

    width:24px;

    height:24px;

    border-radius:50%;

    background:#ffd600;

    border:4px solid white;

    box-shadow:0 0 20px rgba(255,214,0,0.9);

    transform:translate(-50%, -50%);

    animation:pulsar 1.5s infinite;

    display:none;
}

@keyframes pulsar{

    0%{
        transform:translate(-50%, -50%) scale(1);
        opacity:1;
    }

    70%{
        transform:translate(-50%, -50%) scale(1.4);
        opacity:0.7;
    }

    100%{
        transform:translate(-50%, -50%) scale(1);
        opacity:1;
    }
}

.botoes-mapa{

}

    min-width:140px;

    border:2px solid rgba(255,255,255,0.2);

    box-shadow:0 5px 15px rgba(0,0,0,0.25);
}

.botoes-mapa button:hover{

}

.btn-idioma {

 #idioma .botoes{

}
/* ===== SIDEBAR MODERNA ===== */

.sidebar {

  width: 320px;

  height: 100vh;

  padding: 25px;

  overflow-y: auto;

  background: rgba(20, 60, 30, 0.55);

  backdrop-filter: blur(14px);

  border-right: 2px solid rgba(255,255,255,0.12);

  box-shadow: 5px 0 25px rgba(0,0,0,0.25);

}

/* ===== SCROLLBAR ===== */

.sidebar::-webkit-scrollbar {
  width: 10px;
}

.sidebar::-webkit-scrollbar-track {
  background: transparent;
}

.sidebar::-webkit-scrollbar-thumb {

  background: rgba(255,255,255,0.25);

  border-radius: 20px;
}

/* ===== SCROLL HORIZONTAL ===== */

.sidebar::-webkit-scrollbar {
  height: 8px;
}

.sidebar::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.25);
  border-radius: 20px;
}

/* ===== POPUP ===== */
.popup {
  position: fixed; /* Fica fixo na tela */

  left: 0;

  irPara('interacoes');

/* Define idioma e vai para tela principal */
function traduzirTela() {
  const t = traducoes[idioma];

  document.querySelectorAll("[data-key]").forEach(el => {
    const key = el.getAttribute("data-key");

    const textoTraduzido = t[key] || traducoes.pt[key] || el.innerText;

    if (el.tagName === "INPUT") {
      el.placeholder = textoTraduzido;
    } else {
      el.innerText = textoTraduzido;
    }
  });
}

// controla navegação automática

  // evita ficar trocando toda hora sem necessidade
  if(data.estado === estadoAtual) return;

  estadoAtual = data.estado;
  console.log("Estado mudou:", estadoAtual);

  // 🎯 CONTROLE DAS TELAS AUTOMÁTICO

    irPara("idioma");

  else if(data.estado === "sessao"){
    irPara("interacoes");
  }

  // 🌡️ pode mostrar info debug se quiser
  console.log("Distância:", data.distancia);
  console.log("Temp:", data.temperatura);

function ouvirUsuario() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Seu navegador não suporta reconhecimento de voz. Use Chrome ou Edge.");
    return;
  }

  const reconhecimento = new SpeechRecognition();

  reconhecimento.lang = "pt-BR";
  reconhecimento.continuous = false;
  reconhecimento.interimResults = false;
  reconhecimento.maxAlternatives = 1;

  document.getElementById("resposta").innerText = "🎤 Ouvindo... fale agora";

  reconhecimento.start();

  reconhecimento.onresult = async function(event) {
    const texto = event.results[0][0].transcript;

    console.log("Texto reconhecido:", texto);

    document.getElementById("texto").value = texto;
    document.getElementById("resposta").innerText = "Você disse: " + texto;

    await enviar();
  };

  reconhecimento.onspeechend = function() {
    reconhecimento.stop();
  };

  reconhecimento.onerror = function(event) {
  console.log("Erro no reconhecimento:", event.error);

  alert("Erro voz: " + event.error);

  document.getElementById("resposta").innerText =
    "Erro no microfone: " + event.error;
};

  reconhecimento.onend = function() {
    console.log("Reconhecimento finalizado");
  };
}

let sensorJaAtivou = false;

async function verificarSensores() {
    try {
        const resposta = await fetch("/sensores");
        const dados = await resposta.json();

        console.log("Sensores:", dados);

        if (dados.presenca === true && sensorJaAtivou === false) {
            sensorJaAtivou = true;
            irPara("inicio");
        }

        if (dados.temperatura !== null) {
            console.log("Temperatura:", dados.temperatura);
        }

        if (dados.voucher_clima !== null) {
            console.log(dados.voucher_clima.mensagem);
        }

    } catch (erro) {
        console.log("Erro ao ler sensores", erro);
    }
}

setInterval(verificarSensores, 2000);

async function gerarQRCode(){
    const res = await fetch("/gerar-qr");
    const data = await res.json();

    document.getElementById("imagemQR").src =
        data.qr + "?t=" + new Date().getTime();

    document.getElementById("areaQR").style.display = "flex";
}

function fecharQRCode(){
    document.getElementById("areaQR").style.display = "none";
}

// relacionado ao botao de voltar/tela experiencias
const voltarPara = sessionStorage.getItem("voltarPara");

if(voltarPara){
  sessionStorage.removeItem("voltarPara");

  setTimeout(() => {
    irPara(voltarPara);
  }, 300);
}

// timer pra tela de finalizar ir ora tela home
let timerFinalizacao = null;

function iniciarTimerFinalizacao(){
    clearTimeout(timerFinalizacao);

    timerFinalizacao = setTimeout(() => {
        fecharQRCode();
        irPara("inicio");
    }, 25000); // 25 segundos
}

let cliquesAdmin = 0;
let tempoAdmin = null;

document.getElementById("adminArea").addEventListener("click", () => {
    cliquesAdmin++;

    clearTimeout(tempoAdmin);

    if (cliquesAdmin >= 5) {
        cliquesAdmin = 0;
        window.location.href = "/dashboard";
    }

    tempoAdmin = setTimeout(() => {
        cliquesAdmin = 0;
    }, 3000);
});

</script>
